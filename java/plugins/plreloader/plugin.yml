name: PLReloader
version: 1.0.0
main: ru.plreloader.PLReloader
api-version: 1.13
author: PLReloader
commands:
  plreload:
    description: Главная команда плагина
    aliases: [plr, reloader]
    usage: /plreload <reload|load|unload|list|reloadall> [plugin]
permissions:
  plreloader.admin:
    description: Доступ ко всем командам PLReloader
    default: op
