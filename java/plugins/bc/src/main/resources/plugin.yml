name: BC
version: '${version}'
main: org.nig.smp.bc.BcPlugin
api-version: '1.21.11'
author: NightfallRealm
description: Broadcast plugin

commands:
  bc:
    description: Send a broadcast
    usage: /<command> <message>
    aliases: []
  bcmedia:
    description: Send a media-style broadcast
    usage: /<command> <message>
    aliases: []

permissions:
  mediabc:
    description: Allows using /bc with nickname at the end
    default: op
