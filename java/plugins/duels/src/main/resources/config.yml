# ===== Настройки плагина Duels =====

# Название мира, куда телепортируются игроки во время дуэли
# (если мир не существует - он будет создан автоматически как плоский)
world-name: duels

# Миры хаба, где компас выбора кита выдаётся всегда
hub-worlds:
  - world

# Настройка китов.
# Ключ — реальное имя кита из CMI, значение — отображаемое имя и флаг разрушительности.
# destructive: true — кит ломает блоки (ТНТ, кристаллы и т.п.), такие киты играются
# только на картах с allow-block-break: true.
# Если кит не настроен, используется его реальное имя и destructive: false.
kits:
  tnt-war:
    display-name: "&cТНТ-война"
    destructive: true
  swordsman:
    display-name: "&cМечник"

# Режим игры, который устанавливается игрокам в мире дуэлей
duels-gamemode: SURVIVAL

# Спавн лобби в мире дуэлей (на этой точке будет построена платформа и установлен спавн мира)
lobby:
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# ===== Арены (координаты в мире дуэлей) =====
# spawn1 - спавн первого игрока (вызвавшего на дуэль)
# spawn2 - спавн второго игрока
# display-name - отображаемое название карты
# allow-block-break: true - на этой карте можно ломать блоки (для разрушительных китов)
arenas:
  Arena-1:
    enabled: true
    display-name: "&6Арена 1"
    allow-block-break: false
    spawn1:
      x: 0.0
      y: 64.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
    spawn2:
      x: 20.0
      y: 64.0
      z: 0.0
      yaw: 180.0
      pitch: 0.0
  Arena-2:
    enabled: true
    display-name: "&6Арена разрушений"
    allow-block-break: true
    spawn1:
      x: 40.0
      y: 64.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
    spawn2:
      x: 60.0
      y: 64.0
      z: 0.0
      yaw: 180.0
      pitch: 0.0

