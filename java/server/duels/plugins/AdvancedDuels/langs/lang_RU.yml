# DO NOT EDIT THIS VALUE!
config-version: 21

# Define placeholders usable in any message below.
# Example: Adding 'PREFIX: "[Cool]"' below and then putting '{PREFIX}' in a message will display '[Cool]' when the message is sent in game.
STRINGS:
  PREFIX: '&9[Duels]'
  LINE: '&9&m------------------------------------&r'
  HALF_LINE: '&9&m----------------&r'
  FAIL_PREFIX: '&cНе удалось начать дуэль:'


GENERAL:
  true: '&aда'
  false: '&cнет'
  enabled: '&aвключено'
  disabled: '&cвыключено'
  not-selected: 'Не выбрано'
  random: 'Случайно'
  none: 'нет'
  kit-selector: 'Выбор набора'
  arena-selector: 'Выбор арены'
  item-betting: 'Ставки предметами'
  betting: 'Ставки'


ERROR:
  no-permission: '{PREFIX} &cУпс! У тебя нет следующего права: ''%permission%'''
  data:
    load-failure: '{PREFIX} &cНе удалось загрузить твою статистику дуэлей. Попробуй перезайти.'
    not-loaded: '{PREFIX} &cДанные игроков всё ещё загружаются, попробуй позже.'
    not-found: '{PREFIX} &cУ %name% нет доступной статистики дуэлей.'
  top:
    no-data-available: '{PREFIX} &cДанные недоступны.'
  player:
    not-found: '{PREFIX} &c%name% не в сети.'
    no-longer-online: '{PREFIX} &cЭтот игрок больше не в сети.'
  arena:
    not-found: '{PREFIX} &cАрены с именем ''%name%'' не существует.'
    already-exists: '{PREFIX} &cАрена с именем ''%name%'' уже существует.'
    delete-failure: '{PREFIX} &cНельзя удалить арену, которая сейчас используется. Сначала отключи её командой ''/duels toggle %name%'''
    invalid-position: '{PREFIX} &cПозиция должна быть 1 или 2.'
    no-position-set: '{PREFIX} &cУ арены ''%name%'' не заданы позиции.'
    empty-hand: '{PREFIX} &cЧтобы использовать эту команду, ты должен держать предмет в руке.'
  kit:
    not-found: '{PREFIX} &cНабора с именем ''%name%'' не существует.'
    already-exists: '{PREFIX} &cНабор с именем ''%name%'' уже существует.'
    empty-hand: '{PREFIX} &cЧтобы использовать эту команду, ты должен держать предмет в руке.'

  player-only: '{PREFIX} &cЭту команду могут использовать только игроки.'
  duel:
    is-self: '{PREFIX} &cТы не можешь вызвать на дуэль самого себя.'
    inventory-not-empty: '{PREFIX} &cЧтобы использовать эту команду, у тебя должен быть пустой инвентарь.'
    in-creative-mode: '{PREFIX} &cТы не можешь дуэлиться в творческом режиме.'
    in-blacklisted-world: '{PREFIX} &cТы не можешь дуэлиться в этом мире.'
    not-in-enabled-world: '{PREFIX} &cДуэли работают только в разрешённых мирах.'
    target-not-in-enabled-world: '{PREFIX} &cТы не можешь отправить запрос на дуэль игроку %name% здесь.'
    cannot-accept-here: '&cИзвини, ты не можешь принять запрос на дуэль здесь!'
    is-tagged: '{PREFIX} &cТы не можешь дуэлиться, пока помечен боевой меткой.'
    in-cooldown: '{PREFIX} &c%name% находится на перезарядке дуэли в течение %time%.'
    not-in-duelzone: '{PREFIX} &cТы можешь дуэлиться только в следующих регионах: %regions%'
    requests-disabled: '{PREFIX} &c%name% сейчас не принимает запросы на дуэль.'
    force-item-betting-unavailable: '{PREFIX} &cВ принудительных дуэлях нельзя использовать ставки предметами.'
    already-has-request: '{PREFIX} &cТы уже отправил запрос игроку %name%.'
    no-request: '{PREFIX} &cУ тебя нет запроса от %name%.'
    already-in-match:
      sender: '{PREFIX} &cТы не можешь сделать это во время дуэли.'
      target: '{PREFIX} &c%name% уже находится в дуэли.'
    mode-unselected: '{PREFIX} &cТы должен либо выбрать набор, либо включить режим своего инвентаря.'
    mode-fixed: '{PREFIX} &cТебе не разрешено отключать режим своего инвентаря.'
    already-spectating:
      sender: '{PREFIX} &cТы не можешь сделать это в режиме зрителя.'
      target: '{PREFIX} &c%name% находится в режиме зрителя.'
    not-in-match: '{PREFIX} &c%name% не находится в дуэли.'
    prevent-teleportation: '{PREFIX} &cТы не можешь телепортироваться к этому игроку, потому что он в дуэли.'
  party-duel:
    inventory-not-empty: '{PREFIX} &cУ тебя и членов твоей группы должен быть пустой инвентарь, чтобы использовать эту команду.'
    in-creative-mode: '{PREFIX} &cТы или член твоей группы находитесь в творческом режиме.'
    in-blacklisted-world: '{PREFIX} &cТы или член твоей группы находитесь в запрещённом мире.'
    not-in-enabled-world: '{PREFIX} &cТы или член твоей группы не находитесь в разрешённом мире.'
    is-tagged: '{PREFIX} &cТы или член твоей группы сейчас помечены боевой меткой.'
    not-in-duelzone: '{PREFIX} &cТы или член твоей группы сейчас не находитесь ни в одном из следующих регионов: %regions%'
    already-has-request: '{PREFIX} &cТы уже отправил запрос группе игрока %name%.'
    no-request: '{PREFIX} &cУ тебя нет запроса от группы игрока %name%.'
    already-in-match:
      sender: '{PREFIX} &cТы не можешь сделать это, пока твоя группа в дуэли.'
      target: '{PREFIX} &cГруппа игрока %name% уже находится в дуэли.'
    already-spectating:
      sender: '{PREFIX} &cТы не можешь сделать это, пока ты или член твоей группы находитесь в режиме зрителя.'
      target: '{PREFIX} &cЧлен группы игрока %name% находится в режиме зрителя.'
    option-unavailable: '{PREFIX} &cСтавки предметами/деньгами сейчас недоступны для групповых дуэлей.'
  party:
    is-self: '{PREFIX} &cТы не можешь создать группу с самим собой.'
    is-not-owner: '{PREFIX} &cЧтобы сделать это, ты должен быть владельцем этой группы.'
    is-owner: '{PREFIX} &cТы не можешь покинуть эту группу, так как ты её владелец. Тебе нужно либо передать владение группой командой ''/party transfer'', либо распустить группу командой ''/party disband''.'
    requests-disabled: '{PREFIX} &c%name% сейчас не принимает запросы в группу.'
    already-has-invite: '{PREFIX} &cТы уже отправил приглашение игроку %name%.'
    no-invite: '{PREFIX} &cУ тебя нет приглашения от %name%.'
    not-found: '{PREFIX} &cЭта группа больше не существует.'
    already-in-party:
      sender: '{PREFIX} &cТы не можешь сделать это, находясь в группе.'
      target: '{PREFIX} &c%name% уже находится в группе.'
    not-in-party:
      sender: '{PREFIX} &cЧтобы сделать это, ты должен быть в группе.'
      target: '{PREFIX} &c%name% не находится в группе.'
    not-a-member: '{PREFIX} &c%name% не является членом твоей группы.'
    in-same-party: '{PREFIX} &c%name% находится в твоей группе.'
    kick-self: '{PREFIX} &cТы не можешь выгнать самого себя из группы.'
    is-not-same-size: '{PREFIX} &cРазмеры групп должны совпадать, чтобы сделать это.'
    is-not-online:
      sender: '{PREFIX} &cВсе члены твоей группы должны быть в сети!'
      target: '{PREFIX} &cВсе члены группы игрока %name% должны быть в сети!'
    max-size-reached:
      sender: '{PREFIX} &cТвоя группа достигла максимального количества участников!'
      target: '{PREFIX} &cГруппа игрока %name% достигла максимального количества участников!'
    cannot-friendly-fire: '{PREFIX} &cОгонь по союзникам запрещён.'
  setting:
    disabled-option: '{PREFIX} &c%option% сейчас отключено.'
    arena-not-applicable: '{PREFIX} &cТы не можешь использовать набор %kit% на арене %arena%.'
  inventory-view:
    not-a-uuid: '{PREFIX} &c%input% не является корректным UUID.'
    not-found: '{PREFIX} &cИнвентаря с UUID ''%uuid%'' не существует.'
  queue:
    not-found: '{PREFIX} &cОчереди с набором %kit% и ставкой $%bet_amount% не существует.'
    already-exists: '{PREFIX} &cОчередь с набором ''%kit%'' и ставкой $%bet_amount% уже существует.'
    already-in: '{PREFIX} &cТы уже в очереди!'
    not-in-queue: '{PREFIX} &cТы не в очереди.'
    not-enough-money: '{PREFIX} &cЧтобы присоединиться к этой очереди, тебе нужно $%bet_amount%.'
    party-too-large: '{PREFIX} &cВ твоей группе %party_size% участников, но эта очередь позволяет команды размером %team_size%.'
    no-queues-available: '{PREFIX} &cНет доступных очередей.'
  sign:
    not-a-sign: '{PREFIX} &cБлок, на который ты смотришь, не является табличкой!'
    not-found: '{PREFIX} &cЭта табличка не является табличкой очереди!'
    already-exists: '{PREFIX} &cЭта табличка уже является табличкой очереди! Чтобы удалить, используй команду ''/duels delsign'''
    cancel-break: '{PREFIX} &cТы не можешь сломать табличку очереди вручную! Используй команду ''/duels delsign'''
  sound:
    not-found: '{PREFIX} &cЗвука с именем ''%name%'' не существует.'
  command:
    invalid-sub-command: '{PREFIX} &c''%argument%'' не является корректной подкомандой. Напиши ''/%command%'' для помощи.'
    invalid-option: '{PREFIX} &c''%option%'' не является корректной опцией. Доступные опции: %available_options%'
    invalid-action: '{PREFIX} &c''%action%'' не является корректным действием. Доступные действия: %available_actions%'
    not-enough-money: '{PREFIX} &cУ тебя недостаточно денег для ставки!'
    disabled-world: '{PREFIX} &cИзвини, ты не можешь использовать дуэли здесь!'
    lobby-save-failure: '{PREFIX} &cНе удалось сохранить местоположение лобби. Проверь консоль для подробностей.'
    name-not-alphanumeric: '{PREFIX} &c''%name%'' не является буквенно-цифровым.'
    invalid-argument: "{PREFIX} &cНеверный аргумент: {arg}. Плейсхолдеры в командах запрещены."


COMMAND:
  kit:
    usage: '{PREFIX} &cИспользование: /kit [edit|save] [kitname]'
    edit:
      usage: '{PREFIX} &cИспользование: /kit edit <kitname>'
    unknown-subcommand: '{PREFIX} &cНеизвестная подкоманда: %subcommand%'
  duel:
    usage:
      - '{LINE}'
      - '&f/%command% [player] &e- &7Отправляет запрос на дуэль игроку.'
      - '&f/%command% lobby &e- &7Телепортирует тебя в лобби дуэлей.'
      - '&f/%command% [player] <amount> &e- &7Отправляет запрос на дуэль со ставкой.'
      - '&f/%command% [accept | deny] [player] &e- &7Принимает или отклоняет запрос на дуэль.'
      - '&f/%command% stats <name> &e- &7Показывает твою статистику дуэлей.'
      - '&f/%command% toggle &e- &7Включает или отключает получение запросов на дуэль.'
      - '&f/%command% top [-|wins|losses|kit] &e- &7Показывает лучших по победам, поражениям или рейтингу для набора.'
      - '{LINE}'
    request:
      send:
        sender:
          - '{LINE}'
          - '&7Запрос на дуэль отправлен игроку &f%name%&7.'
          - '&6- &7Набор: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
          - '&6- &7Ставка: &6$%bet_amount%'
          - '&6- &7Ставки предметами: &r%item_betting%'
          - '{LINE}'
        receiver:
          - '{LINE}'
          - '&7Получен запрос на дуэль от &f%name%&7.'
          - '&6- &7Набор: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
          - '&6- &7Ставка: &6$%bet_amount%'
          - '&6- &7Ставки предметами: &r%item_betting%'
          - '{LINE}'
        clickable-text:
          info:
            text: '&7Нажми, чтобы '
            hover-text: ''
          accept:
            text: '&a&l[ПРИНЯТЬ] '
            hover-text: '&7Нажми, чтобы &aпринять &7этот запрос.'
          deny:
            text: '&c&l[ОТКЛОНИТЬ]'
            hover-text: '&7Нажми, чтобы &cотклонить &7этот запрос.'
      accept:
        sender: '{PREFIX} &f%name% &7принял твой запрос на дуэль.'
        receiver: '{PREFIX} &7Ты принял запрос на дуэль от &f%name%&7.'
      force:
        sender: '{PREFIX} &7Принудительная дуэль начата против &f%name%&7.'
      deny:
        sender: '{PREFIX} &7Твой запрос на дуэль игроку &f%name% &7был отклонён.'
        receiver: '{PREFIX} &7Ты отклонил запрос на дуэль от &f%name%&7.'
    party-request:
      send:
        sender-party:
          - '{LINE}'
          - '&f%owner% &7отправил запрос на дуэль группе игрока &f%name%&7.'
          - '&6- &7Набор: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '&7Получен запрос на дуэль от группы игрока &f%name%&7.'
          - '&6- &7Набор: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
        clickable-text:
          info:
            text: '&7Нажми, чтобы '
            hover-text: ''
          accept:
            text: '&a&l[ПРИНЯТЬ] '
            hover-text: '&7Нажми, чтобы &aпринять &7этот запрос.'
          deny:
            text: '&c&l[ОТКЛОНИТЬ]'
            hover-text: '&7Нажми, чтобы &cотклонить &7этот запрос.'
          extra:
            text: '{LINE}'
            hover-text: ''
      accept:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &7Группа игрока &f%name% &7приняла запрос на дуэль от &f%owner%&7.'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '{PREFIX} &f%owner% &7принял запрос на дуэль от группы игрока &f%name%&7.'
          - '{LINE}'
      deny:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &7Группа игрока &f%name% &7отклонила запрос на дуэль от &f%owner%&7.'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '{PREFIX} &7&f%owner% &7отклонил запрос на дуэль от группы игрока &f%name%&7.'
          - '{LINE}'
    stats:
      displayed:
        - '{LINE}'
        - '&7Статистика &f%name% &e-'
        - '&7Победы: &a%wins%'
        - '&7Поражения: &c%losses%'
        - '&7Соотношение П/П: &b%wl_ratio%'
        - '&7Запросы: &r%requests_enabled%'
      # NOTE: Ratings will only display if either 'display-kit-ratings' or 'display-nokit-rating' is enabled in the configuration.
      rating:
        header: '&7Рейтинги &e-'
        format: '&f%type%&7: &b%rating%'
        footer: ''
      # NOTE: Past matches will only display if 'display-past-matches' is enabled in the configuration.
      match:
        header: '&7Недавние дуэли &e-'
        format: '&a%winner% &fvs &c%loser% &6[Наведи курсор!]'
        hover-text:
          - '&7Набор: &3%kit%'
          - '&7Длительность: &a%duration%'
          - '&7Время: &f%time% назад'
          - '&7Здоровье: &d%health%❤'
        footer: '{LINE}'
    toggle:
      enabled: '{PREFIX} &aТеперь ты получаешь запросы на дуэль.'
      disabled: '{PREFIX} &cТы больше не принимаешь запросы на дуэль.'
    top:
      next-update: '{PREFIX} &7Следующее обновление: &f%remaining%'
      header: '{HALF_LINE} &7Топ &f10 &7%type% {HALF_LINE}'
      display-format: '&e%rank%. &f%name% &e- &f%score% &7%identifier%'
      footer: '{HALF_LINE} &7Топ &f10 &7%type% {HALF_LINE}'

  duels:
    usage:
      - '{LINE}'
      - '&f/%command% help &e- &7Показывает эту страницу.'
      - '&f/%command% help arena &e- &7Показывает список команд арен.'
      - '&f/%command% help kit &e- &7Показывает список команд наборов.'
      - '&f/%command% help queue &e- &7Показывает список команд очередей.'
      - '&f/%command% help sign &e- &7Показывает список команд табличек.'
      - '&f/%command% help user &e- &7Показывает список команд редактирования игроков.'
      - '&f/%command% help extra &e- &7Показывает список дополнительных команд.'
      - '&f/%command% help arenaregen &e- &7Показывает руководство по восстановлению арен.'
      - '{LINE}'
    help:
      arena:
        - '{HALF_LINE} &fКоманды арен {HALF_LINE}'
        - '&f/%command% create [name] &e- &7Создаёт арену с указанным именем.'
        - '&f/%command% set [name] [1|2] &e- &7Устанавливает позицию телепортации арены.'
        - '&f/%command% delete [name] &e- &7Удаляет арену.'
        - '&f/%command% setarenaitem [name] &e- &7Устанавливает отображаемый предмет для выбранной арены.'
        - '&f/%command% info [name] &e- &7Показывает список информации о выбранной арене.'
        - '&f/%command% toggle [name] &e- &7Включает или отключает арену.'
        - '&f/%command% tp [name] <1|2> &e- &7Телепортирует на арену.'
        - '&f/%command% list &e- &7Показывает список всех арен.'
        - '{HALF_LINE} &fКоманды арен {HALF_LINE}'
      kit:
        - '{HALF_LINE} &fКоманды наборов {HALF_LINE}'
        - '&f/%command% savekit <-o> [name] &e- &7Сохраняет набор с указанным именем.'
        - '&f/%command% loadkit [name] &e- &7Загружает выбранный набор в твой инвентарь.'
        - '&f/%command% deletekit [name] &e- &7Удаляет набор.'
        - '&f/%command% setitem [name] &e- &7Устанавливает отображаемый предмет для выбранного набора.'
        - '&f/%command% options [kit] &e- &7Открывает меню опций для выбранного набора.'
        - '&f/%command% bind [kit] &e- &7Открывает меню привязки арен для выбранного набора.'
        - '&f/%command% list &e- &7Показывает список всех наборов.'
        - '{HALF_LINE} &fКоманды наборов {HALF_LINE}'
      queue:
        - '{HALF_LINE} &fКоманды табличек очередей {HALF_LINE}'
        - '&f/%command% createqueue [bet] [-|kit] &e- &7Создаёт очередь со ставкой и набором.'
        - '&f/%command% deletequeue &e- &7Удаляет очередь со ставкой и набором.'
        - '&f/%command% list &e- &7Показывает список доступных очередей.'
        - '{HALF_LINE} &fКоманды табличек очередей {HALF_LINE}'
      sign:
        - '{HALF_LINE} &fКоманды табличек очередей {HALF_LINE}'
        - '&f/%command% addsign [bet] [-|kit] &e- &7Создаёт табличку очереди со ставкой и набором.'
        - '&f/%command% delsign &e- &7Удаляет табличку очереди, на которую ты смотришь.'
        - '&f/%command% list &e- &7Показывает список табличек очередей.'
        - '{HALF_LINE} &fКоманды табличек очередей {HALF_LINE}'
      user:
        - '{HALF_LINE} &fКоманды редактирования игроков {HALF_LINE}'
        - '&f/%command% setrating [name] [-|kit] [amount] &e- &7Устанавливает рейтинг игрока для набора.'
        - '&f/%command% edit [name] [add|remove|set] [wins|losses] [amount] &e- &7Редактирует статистику игрока.'
