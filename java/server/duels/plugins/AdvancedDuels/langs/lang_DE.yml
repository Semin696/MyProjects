      usage: '{PREFIX} &cVerwendung: /kit edit <kitname>'
    unknown-subcommand: '{PREFIX} &cUnbekannter Unterbefehl: %subcommand%'
  duel:
    usage:
      - '{LINE}'
      - '&f/%command% [player] &e- &7Sendet einem Spieler eine Duellanfrage.'
      - '&f/%command% lobby &e- &7Teleportiert dich zur Duell-Lobby.'
      - '&f/%command% [player] <amount> &e- &7Sendet eine Duellanfrage mit Einsatz.'
