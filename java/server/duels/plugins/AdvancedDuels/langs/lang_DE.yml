          - '&6- &7Kit: &3%kit%'
          - '&6- &7Eigenes Inventar: &r%own_inventory%'
          - '&6- &7Arena: &e%arena%'
          - '&6- &7Einsatz: &6$%bet_amount%'
          - '&6- &7Item-Wetten: &r%item_betting%'
          - '{LINE}'
        clickable-text:
          info:
            text: '&7Klicken zum '
            hover-text: ''
          accept:
            text: '&a&l[ANNEHMEN] '
            hover-text: '&7Klicke, um diese Anfrage &aanzunehmen&7.'
          deny:
            text: '&c&l[ABLEHNEN]'
            hover-text: '&7Klicke, um diese Anfrage &cabzulehnen&7.'
