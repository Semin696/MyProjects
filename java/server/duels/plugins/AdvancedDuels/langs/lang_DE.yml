      deny:
        sender: '{PREFIX} &7Deine Duellanfrage an &f%name% &7wurde abgelehnt.'
        receiver: '{PREFIX} &7Du hast die Duellanfrage von &f%name% &7abgelehnt.'
    party-request:
      send:
        sender-party:
          - '{LINE}'
          - '&f%owner% &7hat eine Duellanfrage an die Gruppe von &f%name% &7gesendet.'
          - '&6- &7Kit: &3%kit%'
          - '&6- &7Eigenes Inventar: &r%own_inventory%'
          - '&6- &7Arena: &e%arena%'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '&7Duellanfrage erhalten von der Gruppe von &f%name%&7.'
          - '&6- &7Kit: &3%kit%'
          - '&6- &7Eigenes Inventar: &r%own_inventory%'
          - '&6- &7Arena: &e%arena%'
        clickable-text:
          info:
            text: '&7Klicken zum '
            hover-text: ''
          accept:
            text: '&a&l[ANNEHMEN] '
            hover-text: '&7Klicke, um diese Anfrage &aanzunehmen&7.'
          deny:
            text: '&c&l[ABLEHNEN]'
            hover-text: '&7Klicke, um diese Anfrage &cabzulehnen&7.'
          extra:
            text: '{LINE}'
            hover-text: ''
      accept:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &7Die Gruppe von &f%name% &7hat die Duellanfrage von &f%owner% &7angenommen.'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '{PREFIX} &f%owner% &7hat die Duellanfrage der Gruppe von &f%name% &7angenommen.'
          - '{LINE}'
      deny:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &7Die Gruppe von &f%name% &7hat die Duellanfrage von &f%owner% &7abgelehnt.'
          - '{LINE}'
        receiver-party:
