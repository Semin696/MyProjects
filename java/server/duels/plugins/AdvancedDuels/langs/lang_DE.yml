          - '&6- &7Eigenes Inventar: &r%own_inventory%'
          - '&6- &7Arena: &e%arena%'
          - '&6- &7Einsatz: &6$%bet_amount%'
          - '&6- &7Item-Wetten: &r%item_betting%'
          - '{LINE}'
