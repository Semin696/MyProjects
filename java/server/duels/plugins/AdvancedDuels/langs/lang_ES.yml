          deny:
            text: '&c&l[RECHAZAR]'
            hover-text: '&7Haz clic para &crechazar &7esta solicitud.'
          extra:
            text: '{LINE}'
            hover-text: ''
      accept:
        sender-party:
          - '{LINE}'
