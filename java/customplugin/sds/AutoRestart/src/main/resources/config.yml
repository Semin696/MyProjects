# AutoRestart Configuration
# Используйте & для цветовых кодов (например, &c для красного)
# Используйте {prefix} в сообщениях, чтобы вставить префикс
# Используйте {seconds} в title, чтобы вставить количество секунд

# Основной префикс для большинства сообщений
prefix: "&e[AutoRestart] &f"

messages:
  # Боссбар при плановом рестарте
  bossbar-planned: "{prefix}Плановый рестарт"
  # Боссбар при техническом рестарте (по команде)
  bossbar-unscheduled: "&c&lТЕХНИЧЕСКИЙ РЕСТАРТ"
  # Предупреждение за 5 минут до рестарта
  five-minutes: "{prefix}Рестарт сервера через &c5 минут&f!"
  # Когда до рестарта менее 5 минут
  less-five-minutes: "{prefix}Рестарт сервера через &cменее 5 минут&f!"
  # Предупреждение за 10 секунд
  ten-seconds: "&c[AutoRestart] Рестарт через 10 секунд!"
  # Тайтл при обратном отсчёте (используйте {seconds})
  title: "&c&lРЕСТАРТ ЧЕРЕЗ {seconds} СЕКУНД"
  # Сообщение при перезапуске сервера
  restarting: "&c&l[AutoRestart] Перезапуск сервера..."
  # Нет прав на команду
  no-permission: "&cУ вас нет прав на выполнение этой команды."
  # Уже запланирован перезапуск
  already-scheduled: "&cПерезапуск уже запланирован."
  # Технический рестарт (команда) - строка 1
  command-1: "&c&l[AutoRestart] &fТехнический рестарт сервера!"
  # Технический рестарт (команда) - строка 2
  command-2: "&c&l[AutoRestart] &fНезапланированный перезапуск через 1 минуту."
