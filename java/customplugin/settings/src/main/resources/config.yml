# Префикс для сообщений в чате (используйте & для цветов)
prefix: "&8[&c&lmcru&8]"

# Настройки по умолчанию для новых игроков
defaults:
  night_vision: false
  fly_speed: false
  walk_speed: false
  auto_fish: false

# Тексты сообщений (используйте & для цветов)
messages:
  # Заголовок меню
  menu_title: "&8\u2699 Настройки"
  # Текст включённой настройки
  enabled: "&a\u2713 Включено"
  # Текст выключенной настройки
  disabled: "&c\u2717 Выключено"
  # Подсказка в меню
  click_to_toggle: "Нажмите, чтобы переключить"
  # Ошибка при попытке использовать команду не игроком
  command_only_players: "&cТолько для игроков"

# Описания настроек (переопределяют значения из кода)
descriptions:
  night_vision: "Даёт эффект ночного зрения"
  fly_speed: "Увеличивает скорость полёта"
  walk_speed: "Увеличивает скорость ходьбы"
  auto_fish: "Автоматически закидывает удочку"
