# Nightfall_motdicon Configuration

motd:
  # Список строк MOTD (выбираются случайно при каждом пинге)
  lines:
    - "           &8[&6Nightfall SMP&8] &7- &fДобро пожаловать!"
    - "           &8[&6Nightfall SMP&8] &7- &fСезон 2 &a\u2714"
  # Если true — строки из списка выше чередуются по порядку
  # Если false — выбирается случайная строка при каждом пинге
  cycle: true

icon:
  # Путь к файлу иконки (относительно папки плагина)
  file: "server-icon.png"
  # Попытка скачать иконку по URL, если файл не найден (оставьте пустым чтобы не скачивать)
  fallback-url: ""
