<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCRLSMP — Webhook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <img src="logo.svg" alt="MCRLSMP" class="logo">
    <div class="header-info">
      <span id="whoami" class="whoami"></span>
      <button class="link hidden" id="logoutBtn">выйти</button>
    </div>
  </header>

  <main class="container">

    <!-- Вход по коду -->
    <section class="card" id="loginCard">
      <h2 class="card-title">Авторизация</h2>
      <input
        type="text"
        id="codeInput"
        class="input"
        placeholder="Введите код доступа"
        autocomplete="off"
        spellcheck="false">
      <button class="button" id="loginBtn">Войти</button>
      <div class="status" id="loginStatus"></div>
      <div class="hint">Код администратора — в консоли браузера (F12)</div>
    </section>

    <!-- Отправка -->
    <section class="card hidden" id="messageCard">
      <h2 class="card-title">Отправка в вебхук</h2>

      <label class="field-label" for="webhookSelect">Вебхук</label>
      <select id="webhookSelect" class="input select"></select>

      <textarea
        id="textInput"
        class="input textarea"
        placeholder="Введите текст"
        rows="4"></textarea>

      <div class="row">
        <button class="button" id="sendText">отправить</button>
        <button class="button small" id="sendImage">Отправить с&nbsp;картинкой</button>
      </div>

      <input type="file" id="imageInput" accept="image/*" hidden>

      <div class="status" id="status"></div>
    </section>

    <!-- Админ-панель -->
    <section class="card hidden" id="adminCard">
      <h2 class="card-title">Админ-панель</h2>

      <label class="field-label" for="newCodeInput">Новый код</label>
      <input
        type="text"
        id="newCodeInput"
        class="input"
        placeholder="Например: FRIEND1"
        autocomplete="off"
        spellcheck="false">

      <label class="field-label" for="newRightsInput">Права (text, image — через запятую)</label>
      <input
        type="text"
        id="newRightsInput"
        class="input"
        placeholder="text,image"
        autocomplete="off"
        spellcheck="false">

      <button class="button" id="addCodeBtn">Добавить код</button>

      <div class="codes-list" id="codesList"></div>

      <button class="button danger" id="kickAllBtn">Отключить всех, кто по коду</button>
      <div class="status" id="adminStatus"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
