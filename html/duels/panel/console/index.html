<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceTrace — Консоль</title>
<script src="../../config.js"></script>
<script>
(function () {
  var allowed = ['cp.spacetrace.sryze.cc', 'spacetrace.sryze.cc', 'localhost', '127.0.0.1'];
  var host = window.location.hostname;
  if (host && allowed.indexOf(host) === -1) {
    window.location.replace('https://cp.spacetrace.sryze.cc/console/');
  }
})();
</script>
<style>
  :root {
    --accent: #58a6ff;
    --accent2: #8b5cf6;
    --accent3: #22d3ee;
    --text: #e6edf3;
    --muted: #9aa7b4;
    --glass: rgba(22,27,34,.55);
    --border: rgba(255,255,255,.10);
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background: #05070f;
    height: 100vh;
    overflow: hidden;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .nebula {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(45% 55% at 20% 15%, rgba(99,102,241,.22), transparent 70%),
      radial-gradient(50% 55% at 85% 20%, rgba(34,211,238,.14), transparent 70%),
      radial-gradient(55% 55% at 70% 95%, rgba(139,92,246,.18), transparent 70%);
    animation: nebulaDrift 26s ease-in-out infinite alternate;
  }
  @keyframes nebulaDrift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(-2%,-3%) scale(1.12); }
  }
  .hidden { display: none !important; }
  .z1 { position: relative; z-index: 1; }

  #loginScreen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card {
    width: 100%; max-width: 400px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(16px);
    padding: 34px 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 60px rgba(88,166,255,.10);
    animation: fadeUp .6s ease both;
  }
  .login-card .brand { text-align: center; margin-bottom: 26px; }
  .login-card .brand .logo {
    font-size: 30px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
    background: linear-gradient(120deg, var(--accent3), var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-card .brand p { color: var(--muted); font-size: 13px; margin-top: 6px; letter-spacing: .04em; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; letter-spacing: .03em; }
  input {
    width: 100%;
    background: rgba(255,255,255,.05);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.18); }
  button {
    background: rgba(255,255,255,.07);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:hover { background: rgba(255,255,255,.14); }
  button:active { transform: scale(.97); }
  button.primary {
    width: 100%; padding: 12px;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    border-color: transparent; color: #fff; font-size: 15px;
    box-shadow: 0 8px 26px rgba(88,166,255,.35);
  }
  button.primary:hover { box-shadow: 0 10px 34px rgba(139,92,246,.5); }
  .err { color: #ff9d99; font-size: 13px; margin-top: 12px; min-height: 18px; text-align: center; }

  /* ---------- консоль ---------- */
  #app { height: 100vh; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px;
    background: rgba(10,13,20,.7);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
  }
  header .brand {
    font-weight: 900; letter-spacing: .08em; text-transform: uppercase; font-size: 15px;
    background: linear-gradient(120deg, var(--accent3), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header nav { display: flex; gap: 6px; }
  header nav a {
    color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 8px; transition: background .2s, color .2s;
  }
  header nav a:hover { background: rgba(255,255,255,.08); color: var(--text); }
  header nav a.active { background: rgba(88,166,255,.15); color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  .dot.online { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .dot.offline { background: var(--red); box-shadow: 0 0 12px var(--red); }
  .dot.connecting { background: var(--yellow); }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(.7);opacity:.55} }
  .grow { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 22px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log .log { color: var(--muted); }
  #log .log.info { color: var(--text); }
  #log .log.warn { color: var(--yellow); }
  #log .log.error { color: var(--red); }
  #log .log.fatal { color: var(--red); font-weight: bold; }
  #log .chat { color: var(--green); }
  #log .sys { color: var(--accent); font-style: italic; }
  #log .cmd { color: #c4b5fd; }
  #log .ts { color: #6e7681; }

  footer {
    display: flex; gap: 8px; align-items: center;
    padding: 12px 22px;
    background: rgba(10,13,20,.8);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  #cmd { flex: 1; font-family: Consolas, "Courier New", monospace; }
  #quick { display: flex; gap: 6px; }
  @media (max-width: 700px) { #quick { display: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="nebula"></div>

  <!-- ================= ВХОД ================= -->
  <div id="loginScreen" class="z1">
    <div class="login-card">
      <div class="brand">
        <div class="logo">SpaceTrace</div>
        <p>Консоль сервера</p>
      </div>
      <div class="field">
        <label>Введите ник (зарегистрированный на сервере)</label>
        <input id="lgNick" placeholder="ник" autocomplete="username">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="lgPass" type="password" placeholder="пароль" autocomplete="current-password">
      </div>
      <button id="btnLogin" class="primary">Войти</button>
      <div class="err" id="lgErr"></div>
    </div>
  </div>

  <!-- ================= КОНСОЛЬ ================= -->
  <div id="app" class="hidden">
    <header>
      <span class="dot" id="dot"></span>
      <span class="brand">SpaceTrace Console</span>
      <span class="hint" id="connInfo">—</span>
      <div class="grow"></div>
      <nav>
        <a href="https://spacetrace.sryze.cc">Сайт</a>
        <a class="active" href="./">Консоль</a>
        <a href="../">Панель</a>
      </nav>
      <button id="btnLogout">Выйти</button>
    </header>

    <div id="log"></div>

    <footer>
      <input id="cmd" placeholder="Введите команду без слэша, например: say hello" autocomplete="off" spellcheck="false">
      <button id="btnSend">Отправить</button>
      <div id="quick">
        <button data-cmd="say Hello from web console!">say</button>
        <button data-cmd="list">list</button>
        <button data-cmd="duel">duel</button>
        <button data-cmd="help">help</button>
      </div>
    </footer>
  </div>

<script>
(function () {
  /* ---------- звёздный фон ---------- */
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var stars = [], meteors = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  var n = Math.min(220, Math.floor(window.innerWidth * window.innerHeight / 6000));
  for (var i = 0; i < n; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.3+.2, tw: Math.random()*Math.PI*2, sp: Math.random()*.02+.005 });
  var last = 0;
  function loop(t) {
    var dt = Math.min(50, t - last || 16); last = t;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (var s of stars) {
      s.tw += s.sp*dt/8;
      var a = .3 + Math.abs(Math.sin(s.tw))*.7;
      ctx.globalAlpha = a; ctx.fillStyle = '#dbe6ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- логика ---------- */
  var WS_ADDR = (typeof CONFIG !== 'undefined' && CONFIG.addr) ? CONFIG.addr : 'ws://play.spacetrace.sryze.cc:38710';
  var ws = null;
  var authed = false;
  var storeKey = 'cpsc_console_session';

  var logEl = document.getElementById('log');
  var dot = document.getElementById('dot');
  var connInfo = document.getElementById('connInfo');
  var loginScreen = document.getElementById('loginScreen');
  var app = document.getElementById('app');

  function setStatus(state, text) {
    dot.className = 'dot ' + state;
    connInfo.textContent = text || '';
  }
  function now() { return new Date().toTimeString().slice(0, 8); }
  function addLine(text, cls) {
    var div = document.createElement('div');
    div.className = 'log ' + (cls || '');
    div.textContent = text;
    logEl.appendChild(div);
    while (logEl.childNodes.length > 2000) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function sys(text) { addLine(now() + '  ' + text, 'sys'); }
  function chat(player, message) { addLine(now() + '  [' + player + '] ' + message, 'chat'); }
  function cmdEcho(cmd) { addLine(now() + '  > /' + cmd, 'cmd'); }

  function saveSession() {
    localStorage.setItem(storeKey, JSON.stringify({ nick: document.getElementById('lgNick').value.trim(), pass: document.getElementById('lgPass').value.trim() }));
  }
  function loadSession() {
    try {
      var s = JSON.parse(localStorage.getItem(storeKey) || '{}');
      if (s.nick) document.getElementById('lgNick').value = s.nick;
      if (s.pass) document.getElementById('lgPass').value = s.pass;
    } catch (e) {}
    if (typeof CONFIG !== 'undefined' && CONFIG.title) document.title = CONFIG.title;
  }
  function showLogin(err) {
    document.getElementById('lgErr').textContent = err || '';
    app.classList.add('hidden');
    loginScreen.classList.remove('hidden');
  }

  function connect(nick, pass) {
    if (ws) ws.close();
    setStatus('connecting', 'подключение...');
    var url = /^wss?:\/\//i.test(WS_ADDR) ? WS_ADDR : 'ws://' + WS_ADDR;
    try { ws = new WebSocket(url); } catch (e) { showLogin('Не удалось подключиться: ' + e.message); return; }

    ws.onopen = function () {
      ws.send(JSON.stringify({ op: 'auth', nick: nick, password: pass }));
    };
    ws.onmessage = function (ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch (e) { addLine(ev.data, 'log'); return; }
      switch (data.op) {
        case 'auth':
          if (data.ok) {
            authed = true;
            app.classList.remove('hidden');
            loginScreen.classList.add('hidden');
            setStatus('online', 'подключено · ' + data.nick);
            sys('Привет, ' + data.nick + '! Подключено к серверу.');
          } else {
            showLogin(data.message === 'wrong password' ? 'Неверный пароль.' : 'Ник не зарегистрирован на сервере. Создайте аккаунт: /connectapi adduser <ник> <пароль>');
          }
          break;
        case 'log':
          addLine(data.line || '', (data.level || 'info').toLowerCase());
          break;
        case 'chat':
          chat(data.player, data.message);
          break;
        case 'status':
          sys('Статус: онлайн ' + data.online + '/' + data.max + ', tps ' + (data.tps ? data.tps.toFixed(1) : '?') + ', игроки: ' + (data.players ? data.players.join(', ') : '-'));
          break;
        case 'cmd_result':
          sys(data.ok ? 'Команда выполнена: /' + data.cmd : 'Команда отклонена: /' + data.cmd);
          break;
        case 'error':
          addLine('Ошибка: ' + data.message, 'error');
          break;
      }
    };
    ws.onerror = function () { sys('Ошибка сети'); };
    ws.onclose = function () {
      setStatus('offline', 'отключено');
      if (authed) sys('Соединение закрыто');
      ws = null;
    };
  }

  document.getElementById('btnLogin').addEventListener('click', function () {
    var nick = document.getElementById('lgNick').value.trim();
    var pass = document.getElementById('lgPass').value.trim();
    if (!nick) { document.getElementById('lgErr').textContent = 'Введите ник'; return; }
    saveSession();
    connect(nick, pass);
  });
  document.getElementById('lgNick').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('btnLogin').click(); });
  document.getElementById('lgPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('btnLogin').click(); });
  document.getElementById('btnLogout').addEventListener('click', function () {
    authed = false;
    if (ws) ws.close();
    ws = null;
    showLogin();
  });

  function sendCmd() {
    if (!ws || ws.readyState !== WebSocket.OPEN) { sys('Сначала подключитесь'); return; }
    var cmd = document.getElementById('cmd').value.trim();
    if (!cmd) return;
    cmdEcho(cmd);
    ws.send(JSON.stringify({ op: 'command', cmd: cmd }));
    document.getElementById('cmd').value = '';
  }
  document.getElementById('btnSend').addEventListener('click', sendCmd);
  document.getElementById('cmd').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendCmd(); });
  document.querySelectorAll('#quick button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById('cmd').value = b.dataset.cmd;
      sendCmd();
    });
  });

  loadSession();
  showLogin('');
})();
</script>
</body>
</html>
